<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - StudentStay</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <i class="fas fa-home"></i>
                <span>StudentStay</span>
            </div>
            <ul class="nav-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/properties">Properties</a></li>
                <li><a href="/dashboard" class="active">Dashboard</a></li>
            </ul>
            <div class="nav-actions">
                <div class="user-menu">
                    <img src="" alt="User" id="userAvatar" class="avatar">
                    <span id="userName">User</span>
                    <button onclick="logout()" class="btn btn-sm btn-danger">Logout</button>
                </div>
            </div>
            <button class="nav-toggle" onclick="document.querySelector('.nav-menu').classList.toggle('active')">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <div class="dashboard">
        <div class="container">
            <h1 id="dashboardTitle">Dashboard</h1>
            
            <div class="dashboard-stats">
                <div class="stat-card">
                    <i class="fas fa-home"></i>
                    <div>
                        <h3 id="myPropertiesCount">0</h3>
                        <p>My Properties</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-calendar-check"></i>
                    <div>
                        <h3 id="myBookingsCount">0</h3>
                        <p>My Bookings</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-star"></i>
                    <div>
                        <h3 id="reviewsCount">0</h3>
                        <p>Reviews</p>
                    </div>
                </div>
            </div>

            <div class="dashboard-actions">
                <a href="/add-property" class="btn btn-primary" id="addPropertyBtn">
                    <i class="fas fa-plus"></i> Add New Property
                </a>
                <a href="/properties" class="btn btn-outline">
                    <i class="fas fa-search"></i> Browse Properties
                </a>
            </div>

            <div class="dashboard-content">
                <div id="studentContent" style="display:none;">
                    <h2>My Bookings</h2>
                    <div id="bookingsList"></div>
                </div>

                <div id="landlordContent" style="display:none;">
                    <h2>My Properties</h2>
                    <div id="propertiesList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user) {
            window.location.href = '/login';
        }

        document.getElementById('userName').textContent = user.name;
        document.getElementById('userAvatar').src = user.profileImage;
        document.getElementById('dashboardTitle').textContent = `Welcome back, ${user.name}!`;

        // Show content based on role
        if (user.role === 'student') {
            document.getElementById('studentContent').style.display = 'block';
            document.getElementById('addPropertyBtn').style.display = 'none';
            loadMyBookings();
        } else if (user.role === 'landlord') {
            document.getElementById('landlordContent').style.display = 'block';
            loadMyProperties();
        }

        async function loadMyProperties() {
            try {
                const response = await fetch('/api/properties/my-properties', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('myPropertiesCount').textContent = data.count;
                    
                    const html = data.data.map(property => `
                        <div class="property-item">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <div>
                                    <h3>${property.title}</h3>
                                    <p>${property.address.area}, ${property.address.city}</p>
                                    <p>Price: ${property.price.currency} ${property.price.amount.toLocaleString()}/${property.price.period}</p>
                                    <p>Rooms: ${property.rooms.available}/${property.rooms.total} available</p>
                                    <p>Status: <span class="status-badge ${property.status}">${property.status}</span></p>
                                </div>
                                <div style="display:flex; gap:8px; flex-shrink:0;">
                                    <a href="/add-property?edit=${property._id}" class="btn btn-sm btn-primary"><i class="fas fa-edit"></i> Edit</a>
                                    <button class="btn btn-sm btn-danger" onclick="deleteProperty('${property._id}')"><i class="fas fa-trash"></i> Delete</button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                    
                    document.getElementById('propertiesList').innerHTML = html || '<p>No properties yet</p>';
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function deleteProperty(id) {
            if (!confirm('Are you sure you want to delete this property?')) return;
            
            try {
                const response = await fetch(`/api/properties/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                if (data.success) {
                    alert('Property deleted successfully!');
                    loadMyProperties();
                } else {
                    alert(data.message || 'Failed to delete property');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error deleting property');
            }
        }

        async function loadMyBookings() {
            try {
                const response = await fetch('/api/bookings/my-bookings', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('myBookingsCount').textContent = data.count;
                    
                    const html = data.data.map(booking => `
                        <div class="booking-item">
                            <h3>${booking.property?.title}</h3>
                            <p>Start: ${new Date(booking.startDate).toLocaleDateString()}</p>
                            <p>Status: ${booking.status}</p>
                            <p>Amount: ${booking.totalAmount} BDT</p>
                        </div>
                    `).join('');
                    
                    document.getElementById('bookingsList').innerHTML = html || '<p>No bookings yet</p>';
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login';
        }
    </script>
</body>
</html>
